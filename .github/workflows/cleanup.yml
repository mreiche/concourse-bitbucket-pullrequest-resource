name: Clean up images

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete PR and untagged image versions
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const packageName = context.repo.repo.toLowerCase();
            const { data: account } = await github.rest.users.getByUsername({ username: owner });
            const scope = account.type === 'Organization' ? 'orgs' : 'users';
            const base = `/${scope}/{owner}/packages/container/{package_name}/versions`;
            const params = { owner, package_name: packageName, per_page: 100 };
            const versions = await github.paginate(`GET ${base}`, params);

            for (const version of versions) {
              const tags = version.metadata?.container?.tags;
              if (!Array.isArray(tags)) {
                core.warning(`Skipping version ${version.id}: container tags are missing`);
                continue;
              }
              if (tags.every(tag => /^pr-[0-9]+$/.test(tag))) {
                core.info(`Deleting version ${version.id} (${tags.join(', ') || 'untagged'})`);
                await github.request(`DELETE ${base}/{package_version_id}`, {
                  ...params,
                  package_version_id: version.id,
                });
              }
            }